from textwrap import dedent

html = dedent("""
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fishing Line Pro</title>

<style>
body{
    margin:0;
    background:#08131f;
    color:white;
    font-family:Arial,sans-serif;
}
header{
    background:#0f2236;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
button{
    cursor:pointer;
}
.container{
    padding:20px;
}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}
.card{
    background:#12263d;
    border-radius:10px;
    padding:15px;
}
.price{
    color:#00d5ff;
    font-size:22px;
    font-weight:bold;
}
input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border:none;
    border-radius:6px;
}
.btn{
    background:#00a9d6;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:6px;
}
.cart{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#00a9d6;
    color:white;
    border:none;
    padding:15px;
    border-radius:50%;
    font-size:18px;
}
.hidden{
    display:none;
}
</style>
</head>
<body>

<header>
    <h2>🎣 Fishing Line Pro</h2>
    <div>
        <button class="btn" onclick="showPage('shopPage')">Negozio</button>
        <button class="btn" onclick="showPage('adminPage')">Admin</button>
    </div>
</header>

<div class="container">

    <div id="loginPage">
        <h1>Accesso Cliente</h1>

        <label>Nome</label>
        <input type="text" id="customerName">

        <label>Telefono</label>
        <input type="text" id="customerPhone">

        <button class="btn" onclick="login()">Entra</button>
    </div>

    <div id="shopPage" class="hidden">
        <h1>Catalogo</h1>

        <div class="grid" id="products"></div>
    </div>

    <div id="adminPage" class="hidden">
        <h1>Pannello Admin</h1>

        <label>Password Admin</label>
        <input type="password" id="adminPassword">

        <button class="btn" onclick="adminLogin()">Accedi</button>

        <div id="adminPanel" class="hidden">
            <h2>Ordini</h2>
            <div id="orders"></div>

            <hr>

            <h2>Aggiungi prodotto</h2>

            <label>Nome</label>
            <input type="text" id="newName">

            <label>Prezzo</label>
            <input type="number" id="newPrice">

            <label>Stock</label>
            <input type="number" id="newStock">

            <button class="btn" onclick="addProduct()">Salva</button>
        </div>
    </div>

</div>

<button class="cart" onclick="openCart()">
🛒
</button>

<script>

/*
===================================================
CONFIGURAZIONE TELEGRAM GLOBALE
===================================================

SOSTITUISCI QUESTI VALORI CON I TUOI.

Il motivo per cui Telegram funzionava solo sul tuo
telefono è che il token veniva salvato nel localStorage
del tuo browser.

Adesso è globale nel codice.

===================================================
*/

const TELEGRAM_BOT_TOKEN = "INSERISCI_TOKEN_BOT";
const TELEGRAM_CHAT_ID = "INSERISCI_CHAT_ID";

const ADMIN_PASSWORD = "SuperPassword123!";

/*
===================================================
DATABASE LOCALE
===================================================
*/

let products = JSON.parse(localStorage.getItem("products")) || [
    {
        id:1,
        name:"Canna Carbon Pro",
        price:89.99,
        stock:10
    },
    {
        id:2,
        name:"Mulinello Titan",
        price:49.99,
        stock:5
    }
];

let orders = JSON.parse(localStorage.getItem("orders")) || [];

let cart = [];

let currentUser = null;

/*
===================================================
UTILS
===================================================
*/

function saveData(){
    localStorage.setItem("products", JSON.stringify(products));
    localStorage.setItem("orders", JSON.stringify(orders));
}

function showPage(id){

    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("shopPage").classList.add("hidden");
    document.getElementById("adminPage").classList.add("hidden");

    document.getElementById(id).classList.remove("hidden");
}

function login(){

    const name = document.getElementById("customerName").value.trim();
    const phone = document.getElementById("customerPhone").value.trim();

    if(name.length < 2){
        alert("Nome non valido");
        return;
    }

    const phoneRegex = /^[0-9+ ]{6,20}$/;

    if(!phoneRegex.test(phone)){
        alert("Telefono non valido");
        return;
    }

    currentUser = {
        name,
        phone
    };

    renderProducts();

    showPage("shopPage");
}

function renderProducts(){

    const container = document.getElementById("products");

    container.innerHTML = "";

    products.forEach(product=>{

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <h3>${product.name}</h3>
            <div class="price">${product.price.toFixed(2)} €</div>
            <p>Stock: ${product.stock}</p>

            <button class="btn"
                ${product.stock <= 0 ? "disabled" : ""}
                onclick="addToCart(${product.id})">
                Aggiungi
            </button>
        `;

        container.appendChild(card);
    });
}

function addToCart(id){

    const product = products.find(p=>p.id === id);

    if(!product){
        return;
    }

    if(product.stock <= 0){
        alert("Prodotto esaurito");
        return;
    }

    const existing = cart.find(c=>c.id === id);

    if(existing){

        if(existing.qty >= product.stock){
            alert("Stock massimo raggiunto");
            return;
        }

        existing.qty++;

    }else{

        cart.push({
            id:product.id,
            name:product.name,
            price:product.price,
            qty:1
        });
    }

    alert("Prodotto aggiunto");
}

function openCart(){

    if(cart.length === 0){
        alert("Carrello vuoto");
        return;
    }

    let text = "Carrello:\\n\\n";

    let total = 0;

    cart.forEach(item=>{

        total += item.price * item.qty;

        text += `${item.qty}x ${item.name} - ${(item.price * item.qty).toFixed(2)} €\\n`;
    });

    text += `\\nTotale: ${total.toFixed(2)} €`;

    const confirmOrder = confirm(text + "\\n\\nInviare ordine?");

    if(confirmOrder){
        submitOrder();
    }
}

async function submitOrder(){

    if(cart.length === 0){
        return;
    }

    let total = 0;

    cart.forEach(item=>{

        total += item.price * item.qty;

        const product = products.find(p=>p.id === item.id);

        if(product){
            product.stock -= item.qty;
        }
    });

    const order = {
        id: Date.now(),
        customer: currentUser,
        items:[...cart],
        total,
        status:"new",
        date:new Date().toLocaleString("it-IT")
    };

    orders.unshift(order);

    saveData();

    await sendTelegram(order);

    cart = [];

    renderProducts();

    renderOrders();

    alert("Ordine inviato correttamente");
}

async function sendTelegram(order){

    if(
        TELEGRAM_BOT_TOKEN === "INSERISCI_TOKEN_BOT" ||
        TELEGRAM_CHAT_ID === "INSERISCI_CHAT_ID"
    ){
        console.warn("Telegram non configurato");
        return;
    }

    let message = `🎣 NUOVO ORDINE\\n\\n`;

    message += `Cliente: ${order.customer.name}\\n`;
    message += `Telefono: ${order.customer.phone}\\n`;
    message += `Data: ${order.date}\\n\\n`;

    order.items.forEach(item=>{
        message += `${item.qty}x ${item.name}\\n`;
    });

    message += `\\nTotale: ${order.total.toFixed(2)} €`;

    try{

        const response = await fetch(
            `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message
                })
            }
        );

        const data = await response.json();

        console.log(data);

    }catch(error){

        console.error(error);
    }
}

function adminLogin(){

    const password = document.getElementById("adminPassword").value;

    if(password !== ADMIN_PASSWORD){
        alert("Password errata");
        return;
    }

    document.getElementById("adminPanel").classList.remove("hidden");

    renderOrders();
}

function renderOrders(){

    const container = document.getElementById("orders");

    if(!container){
        return;
    }

    container.innerHTML = "";

    if(orders.length === 0){

        container.innerHTML = "<p>Nessun ordine</p>";

        return;
    }

    orders.forEach(order=>{

        const div = document.createElement("div");

        div.className = "card";

        let items = "";

        order.items.forEach(item=>{
            items += `<li>${item.qty}x ${item.name}</li>`;
        });

        div.innerHTML = `
            <h3>${order.customer.name}</h3>
            <p>${order.customer.phone}</p>
            <p>${order.date}</p>

            <ul>${items}</ul>

            <strong>${order.total.toFixed(2)} €</strong>

            <br><br>

            <button class="btn" onclick="deleteOrder(${order.id})">
                Elimina
            </button>
        `;

        container.appendChild(div);
    });
}

function deleteOrder(id){

    orders = orders.filter(o=>o.id !== id);

    saveData();

    renderOrders();
}

function addProduct(){

    const name = document.getElementById("newName").value.trim();
    const price = parseFloat(document.getElementById("newPrice").value);
    const stock = parseInt(document.getElementById("newStock").value);

    if(!name || isNaN(price) || isNaN(stock)){
        alert("Compila tutti i campi");
        return;
    }

    products.push({
        id:Date.now(),
        name,
        price,
        stock
    });

    saveData();

    renderProducts();

    alert("Prodotto aggiunto");
}

renderProducts();

</script>

</body>
</html>
""")

path = "/mnt/data/fishing_line_pro.html"

with open(path, "w", encoding="utf-8") as f:
    f.write(html)

print(path)
