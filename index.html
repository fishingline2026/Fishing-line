<style>
/* ============================================================
   DESIGN SYSTEM — LIGHT LUXURY MARINE
   ============================================================ */
:root {
  --white:    #ffffff;
  --ivory:    #f8f6f2;
  --ivory2:   #f0ede6;
  --navy:     #0d2137;
  --navy2:    #163350;
  --teal:     #1a7a8a;
  --teal2:    #0f5a68;
  --teal-lt:  #e8f4f6;
  --teal-mid: #b8dde3;
  --gold:     #b8913a;
  --gold-lt:  #f5ead4;
  --text:     #1a2633;
  --text2:    #4a5a6a;
  --text3:    #7a8a9a;
  --border:   #dde4e8;
  --border2:  #c8d4da;
  --red:      #c0392b;
  --green:    #1a7a55;
  --shadow-sm: 0 1px 4px rgba(13,33,55,.07);
  --shadow:    0 4px 16px rgba(13,33,55,.10);
  --shadow-lg: 0 12px 40px rgba(13,33,55,.14);
  --r:    8px;
  --r2:   14px;
  --r3:   22px;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--ivory);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* UTILITIES */
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
.page { display: none; animation: fadeUp .35s ease both; }
.page.on { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* DECORATIVE WAVE HEADER BG */
.wave-bg {
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, var(--teal), var(--teal2), var(--navy), var(--teal));
  background-size: 200% 100%;
  animation: waveShift 4s linear infinite;
}
@keyframes waveShift { 0%{background-position:0% 0%} 100%{background-position:200% 0%} }

/* ============================================================
   HEADER
   ============================================================ */
header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,.96);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 12px rgba(13,33,55,.06);
  backdrop-filter: blur(12px);
}
.hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0; height: 64px; gap: 16px; flex-wrap: wrap;
}
.logo { background: none; border: none; cursor: pointer; text-align: left; padding: 0; }
.logo-main {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px; font-weight: 700;
  color: var(--navy); letter-spacing: 1.5px;
  display: block;
}
.logo-hook { color: var(--teal); }
.logo-sub {
  font-size: 9px; letter-spacing: 3.5px; text-transform: uppercase;
  color: var(--text3); display: block; margin-top: 1px;
}
nav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.nb {
  background: none; border: none; color: var(--text2);
  padding: 7px 15px; border-radius: var(--r);
  cursor: pointer; font-family: 'DM Sans', sans-serif;
  font-size: 14px; font-weight: 500; transition: all .18s;
}
.nb:hover { background: var(--teal-lt); color: var(--teal2); }
.nb.on { background: var(--teal-lt); color: var(--teal2); font-weight: 600; }
.cart-btn {
  display: flex; align-items: center; gap: 8px;
  background: var(--navy); border: none; color: var(--white);
  padding: 9px 20px; border-radius: var(--r3);
  cursor: pointer; font-family: 'DM Sans', sans-serif;
  font-size: 14px; font-weight: 500; transition: all .18s;
}
.cart-btn:hover { background: var(--navy2); transform: translateY(-1px); box-shadow: var(--shadow); }
.cart-badge {
  background: var(--teal); color: var(--white);
  border-radius: 50%; width: 20px; height: 20px;
  font-size: 11px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
}

/* ============================================================
   WELCOME PAGE
   ============================================================ */
.welcome-shell {

}

}
.welcome-deco-2 {

.wc-title em { color: var(--teal); font-style: italic; }

.form-group { margin-bottom: 16px; }

  width: 100%;

  border: 1.5px solid var(--border);
  color: var(--text);
  border-radius: var(--r);
  padding: 12px 16px;
  font-family: 'DM Sans', sans-serif;

}

.btn-primary {
  width: 100%;
  background: var(--navy);
  border: none; color: var(--white);
  padding: 15px;
  border-radius: var(--r);
  cursor: pointer;
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px; font-weight: 700; letter-spacing: .5px;
  transition: all .18s;
  box-shadow: 0 4px 16px rgba(13,33,55,.2);
  margin-top: 6px;
}
.btn-primary:hover { background: var(--navy2); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(13,33,55,.28); }
.err-msg { color: var(--red); font-size: 13px; margin-top: 10px; text-align: center; }

/* ============================================================
   SHOP PAGE
   ============================================================ */
.pp { padding: 36px 0 72px; }
.shop-hero {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 60%, var(--teal2) 100%);
  border-radius: var(--r2);
  padding: 36px 40px;

  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 16px;
  position: relative; overflow: hidden;
}
.shop-hero::after {
  content: '';
  position: absolute; right: -40px; top: -40px;

  background: radial-gradient(circle, rgba(26,122,138,.3) 0%, transparent 70%);
  border-radius: 50%; pointer-events: none;
}
.shop-hero h2 {
  font-family: 'Cormorant Garamond', serif;

}
.shop-hero p { font-size: 14px; color: rgba(255,255,255,.65); margin-top: 4px; }
#greeting { font-size: 14px; color: rgba(255,255,255,.75); margin-top: 5px; }
#greeting strong { color: var(--white); }
.filter-bar {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px;
  padding-bottom: 20px; border-bottom: 1px solid var(--border);

.filter-bar span {
  font-size: 11px; font-weight: 600; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--text3);
  display: flex; align-items: center; margin-right: 4px;
}
.fb {
  background: var(--white); border: 1.5px solid var(--border);
  color: var(--text2); border-radius: 20px; padding: 6px 18px;
  cursor: pointer; font-family: 'DM Sans', sans-serif;
  font-size: 13px; font-weight: 500; transition: all .18s;
}
.fb:hover { border-color: var(--teal); color: var(--teal); }
.fb.on {
  background: var(--navy); border-color: var(--navy);
  color: var(--white); font-weight: 600;
}
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(265px, 1fr)); gap: 20px; }

/* PRODUCT CARD */
.pcard {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  overflow: hidden;
  transition: all .22s;
  box-shadow: var(--shadow-sm);
}
.pcard:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow-lg);
  border-color: var(--teal-mid);
}
.pimg {
  background: linear-gradient(135deg, var(--teal-lt), #d8eef2);
  height: 110px;
  display: flex; align-items: center; justify-content: center;
  font-size: 52px;
  position: relative;
}
.pimg-badge {
  position: absolute; top: 10px; right: 10px;

  border-radius: 6px; padding: 3px 8px;
  font-size: 10px; font-weight: 600;

}
.pbody { padding: 18px 20px; }
.pcat {
  font-size: 10px; font-weight: 600; letter-spacing: 2px;

.pname {

.pprice-wrap {}

}
.pstock {

}
.stock-ok { color: var(--green); }

.add-btn {
  background: var(--teal);
  border: none; color: var(--white);
  border-radius: var(--r);
  padding: 10px 18px;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px; font-weight: 600;
  white-space: nowrap; transition: all .18s;
  box-shadow: 0 2px 8px rgba(26,122,138,.25);
}
.add-btn:hover { background: var(--teal2); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(26,122,138,.35); }
.add-btn:disabled {
  background: var(--border); color: var(--text3);
  cursor: not-allowed; box-shadow: none; transform: none;
}
.empty-grid {
  grid-column: 1/-1; text-align: center;
  padding: 60px 20px; color: var(--text3); font-size: 15px;
}

/* ============================================================
   CART DRAWER
   ============================================================ */
.cart-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(13,33,55,.45);
  backdrop-filter: blur(4px);
}
.cart-overlay.on { display: block; animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
.cart-drawer {

  background: var(--white);
  border-left: 1px solid var(--border);

  box-shadow: -8px 0 40px rgba(13,33,55,.15);

}
@keyframes slideIn { from { transform: translateX(100%); } to { transform: none; } }
.drawer-head {

}

.drawer-close {

.drawer-items { flex: 1; overflow-y: auto; padding: 16px 24px; }

.cart-item {
  display: flex; align-items: center; gap: 12px;

}
.cart-item:last-child { border: none; }
.ci-icon { font-size: 30px; flex-shrink: 0; }
.ci-info { flex: 1; min-width: 0; }
.ci-name {
  font-size: 14px; font-weight: 600; color: var(--text);

}

}
.drawer-foot {

}
.cart-total-row {

}

  font-family: 'Cormorant Garamond', serif;
  font-size: 28px; font-weight: 700; color: var(--navy);
}

  width: 100%;

  border-radius: var(--r);

  font-family: 'Cormorant Garamond', serif;

  transition: all .18s;
  box-shadow: 0 4px 16px rgba(26,122,138,.3);
}
