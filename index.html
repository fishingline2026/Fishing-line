<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fishing Line — Attrezzatura da Pesca</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --white:#ffffff; --ivory:#f8f6f2; --ivory2:#f0ede6;
  --navy:#0d2137; --navy2:#163350;
  --teal:#1a7a8a; --teal2:#0f5a68; --teal-lt:#e8f4f6; --teal-mid:#b8dde3;
  --text:#1a2633; --text2:#4a5a6a; --text3:#7a8a9a;
  --border:#dde4e8; --border2:#c8d4da;
  --red:#c0392b; --green:#1a7a55;
  --shadow-sm:0 1px 4px rgba(13,33,55,.07);
  --shadow:0 4px 16px rgba(13,33,55,.10);
  --shadow-lg:0 12px 40px rgba(13,33,55,.14);
  --r:8px; --r2:14px; --r3:22px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ivory);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.6;min-height:100vh;overflow-x:hidden}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.page{display:none;animation:fadeUp .35s ease both}
.page.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* HEADER */
header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.97);border-bottom:1px solid var(--border);box-shadow:0 2px 12px rgba(13,33,55,.06);backdrop-filter:blur(12px)}
.hdr{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px;flex-wrap:wrap}
.logo{background:none;border:none;cursor:pointer;text-align:left;padding:0}
.logo-main{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;color:var(--navy);letter-spacing:1.5px;display:block}
.logo-hook{color:var(--teal)}
.logo-sub{font-size:9px;letter-spacing:3.5px;text-transform:uppercase;color:var(--text3);display:block;margin-top:1px}
nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nb{background:none;border:none;color:var(--text2);padding:7px 15px;border-radius:var(--r);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;transition:all .18s}
.nb:hover,.nb.on{background:var(--teal-lt);color:var(--teal2)}
.nb.on{font-weight:600}
.cart-btn{display:flex;align-items:center;gap:8px;background:var(--navy);border:none;color:#fff;padding:9px 20px;border-radius:var(--r3);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;transition:all .18s}
.cart-btn:hover{background:var(--navy2);transform:translateY(-1px)}
.cart-badge{background:var(--teal);color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}

/* WELCOME */
.welcome-shell{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(160deg,var(--ivory) 0%,#eaf3f5 50%,var(--ivory2) 100%);position:relative;overflow:hidden}
.deco{position:absolute;pointer-events:none;border-radius:50%}
.deco1{top:-80px;right:-80px;width:420px;height:420px;background:radial-gradient(circle,rgba(26,122,138,.08),transparent 70%)}
.deco2{bottom:-60px;left:-60px;width:320px;height:320px;background:radial-gradient(circle,rgba(13,33,55,.06),transparent 70%)}
.welcome-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r2);padding:52px 44px;max-width:460px;width:100%;box-shadow:var(--shadow-lg);position:relative;z-index:2}
.wc-badge{display:inline-flex;align-items:center;gap:7px;background:var(--teal-lt);color:var(--teal2);border:1px solid var(--teal-mid);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;margin-bottom:22px}
.wc-title{font-family:'Cormorant Garamond',serif;font-size:clamp(30px,5vw,42px);font-weight:700;color:var(--navy);line-height:1.1;margin-bottom:10px}
.wc-title em{color:var(--teal);font-style:italic}
.wc-sub{font-size:15px;color:var(--text2);margin-bottom:32px;line-height:1.7}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:11px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;color:var(--text3);margin-bottom:7px}
.fg input,.fi{width:100%;background:var(--ivory);border:1.5px solid var(--border);color:var(--text);border-radius:var(--r);padding:12px 16px;font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s}
.fg input:focus,.fi:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(26,122,138,.1);background:var(--white)}
.fg input::placeholder,.fi::placeholder{color:var(--border2)}
.btn-primary{width:100%;background:var(--navy);border:none;color:#fff;padding:15px;border-radius:var(--r);cursor:pointer;font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;letter-spacing:.5px;transition:all .18s;box-shadow:0 4px 16px rgba(13,33,55,.2);margin-top:6px}
.btn-primary:hover{background:var(--navy2);transform:translateY(-2px)}
.err-msg{color:var(--red);font-size:13px;margin-top:10px;text-align:center}

/* SHOP */
.pp{padding:36px 0 72px}
.shop-hero{background:linear-gradient(135deg,var(--navy),var(--navy2) 60%,var(--teal2));border-radius:var(--r2);padding:36px 40px;margin-bottom:32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;position:relative;overflow:hidden}
.shop-hero::after{content:'';position:absolute;right:-40px;top:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(26,122,138,.3),transparent 70%);border-radius:50%}
.shop-hero h2{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;color:#fff}
#greeting{font-size:14px;color:rgba(255,255,255,.75);margin-top:5px}
#greeting strong{color:#fff}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border);align-items:center}
.filter-label{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-right:4px}
.fb{background:var(--white);border:1.5px solid var(--border);color:var(--text2);border-radius:20px;padding:6px 18px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;transition:all .18s}
.fb:hover{border-color:var(--teal);color:var(--teal)}
.fb.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:20px}

/* PRODUCT CARD */
.pcard{background:var(--white);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;transition:all .22s;box-shadow:var(--shadow-sm)}
.pcard:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:var(--teal-mid)}
.pimg{background:linear-gradient(135deg,var(--teal-lt),#d8eef2);height:180
