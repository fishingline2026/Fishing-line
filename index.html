<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FishingLine</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f8f6f2; }
        .page { display: none; padding: 20px; }
        .page.on { display: block; }
        header { background: #fff; padding: 15px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; }
        .fg { margin-bottom: 15px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; }
        .btn { background: #0d2137; color: #fff; padding: 10px 20px; border: none; cursor: pointer; }
        .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .pcard { background: #fff; padding: 15px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<header>
    <strong>FishingLine</strong>
    <nav>
        <button onclick="showPage('welcome')">Home</button>
        <button onclick="showPage('shop')">Negozio</button>
        <button onclick="showPage('admin-login')">Admin</button>
    </nav>
</header>

<main id="page-welcome" class="page on">
    <h2>Benvenuto</h2>
    <div class="fg"><label>Nome</label><input type="text" id="username"></div>
    <div class="fg"><label>Telefono</label><input type="tel" id="userphone"></div>
    <button class="btn" onclick="login()">Entra</button>
</main>

<main id="page-shop" class="page">
    <h2>Negozio</h2>
    <div id="filters">
        <button onclick="filter('tutti')">Tutti</button>
        <button onclick="filter('fili')">Fili</button>
        <button onclick="filter('mulinelli')">Mulinelli</button>
        <button onclick="filter('canne')">Canne</button>
        <button onclick="filter('minuteria')">Minuteria</button>
        <button onclick="filter('accessori')">Accessori</button>
        <button onclick="filter('usato')">Usato</button>
    </div>
    <div class="pgrid" id="product-grid"></div>
</main>

<main id="page-admin-login" class="page">
    <h2>Login Admin</h2>
    <input type="password" id="admin-pwd" placeholder="Password">
    <button class="btn" onclick="loginAdmin()">Accedi</button>
</main>

<main id="page-admin-dash" class="page">
    <h2>Dashboard Admin</h2>
    <div class="fg">
        <input type="text" id="add-name" placeholder="Nome Prodotto">
        <select id="add-cat">
            <option value="fili">Fili</option>
            <option value="mulinelli">Mulinelli</option>
            <option value="canne">Canne</option>
            <option value="minuteria">Minuteria</option>
            <option value="accessori">Accessori</option>
            <option value="usato">Usato</option>
        </select>
        <button class="btn" onclick="addProduct()">Aggiungi</button>
    </div>
</main>

<script>
    let products = [{name: "Prodotto Esempio", category: "fili"}];
    let isAdmin = false;

    function showPage(id) {
        if(id === 'page-admin-dash' && !isAdmin) return alert('Non autorizzato');
        document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
        document.getElementById('page-' + id).classList.add('on');
    }

    function login() { 
        if(document.getElementById('username').value) showPage('shop');
        else alert('Inserisci nome');
    }

    function loginAdmin() {
        if(document.getElementById('admin-pwd').value === '07899') {
            isAdmin = true;
            showPage('admin-dash');
        } else {
            alert('Password errata');
        }
    }

    function addProduct() {
        products.push({
            name: document.getElementById('add-name').value,
            category: document.getElementById('add-cat').value
        });
        alert('Aggiunto!');
    }

    function filter(cat) {
        const grid = document.getElementById('product-grid');
        grid.innerHTML = products
            .filter(p => cat === 'tutti' || p.category === cat)
            .map(p => `<div class="pcard"><h3>${p.name}</h3><p>${p.category}</p></div>`)
            .join('');
    }
    
    // Inizializza il negozio
    filter('tutti');
</script>
</body>
</html>
