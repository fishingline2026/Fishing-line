<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FishingLine — Attrezzatura da Pesca</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--white:#fff;--ivory:#f8f6f2;--ivory2:#f0ede6;--navy:#0d2137;--navy2:#163350;--teal:#1a7a8a;--teal2:#0f5a68;--teal-lt:#e8f4f6;--teal-mid:#b8dde3;--text:#1a2633;--text2:#4a5a6a;--text3:#7a8a9a;--border:#dde4e8;--border2:#c8d4da;--red:#c0392b;--green:#1a7a55;--orange:#e67e22;--shadow-sm:0 1px 4px rgba(13,33,55,.07);--shadow-lg:0 12px 40px rgba(13,33,55,.14);--r:8px;--r2:14px;--r3:22px;--hdr:56px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--ivory);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.6;min-height:100vh;overflow-x:hidden}
.page{display:none}.page.on{display:block;animation:fadeUp .3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* SPLASH */
#splash{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:999999;background:#0a1628;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sp-enter-btn{margin-top:46px;background:transparent;border:2px solid rgba(255,255,255,.6);color:#fff;padding:15px 58px;border-radius:50px;font-family:'Cormorant Garamond',serif;font-size:22px;cursor:pointer}
.hide-header header{display:none}
header{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.97);border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}
.hdr{display:flex;align-items:center;justify-content:space-between;height:var(--hdr);padding:0 10px;max-width:1120px;margin:0 auto}
.logo-main{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--navy)}
.nb{background:none;border:none;padding:6px 8px;cursor:pointer}
.nb.on{background:var(--teal-lt);color:var(--teal2)}
.cart-btn{background:var(--navy);color:#fff;padding:7px 11px;border-radius:20px;cursor:pointer}
.welcome-shell{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.welcome-card{background:var(--white);border-radius:var(--r2);padding:28px;max-width:420px;width:100%;box-shadow:var(--shadow-lg)}
.fg{margin-bottom:12px}
.fg input{width:100%;padding:11px;background:var(--ivory);border:1.5px solid var(--border);border-radius:var(--r)}
.btn-primary{width:100%;background:var(--navy);color:#fff;padding:13px;border-radius:var(--r);cursor:pointer;font-weight:700}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.pcard{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--border)}
.pimg{height:160px;background:var(--teal-lt);display:flex;align-items:center;justify-content:center;font-size:40px}
.pinfo{padding:13px}
.modal-overlay{position:fixed;inset:0;background:rgba(10,20,35,.65);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-box{background:var(--white);border-radius:14px;width:100%;max-width:480px;padding:20px}
</style>
</head>
<body class="hide-header">

<div id="splash">
  <button class="sp-enter-btn" onclick="dismissSplash()">ENTRA</button>
</div>

<header>
  <div class="hdr">
    <button class="logo" onclick="showPage('welcome')"><span class="logo-main">FishingLine</span></button>
    <nav>
      <button class="nb on" id="btn-welcome" onclick="showPage('welcome')">Home</button>
      <button class="nb" id="btn-shop" onclick="requireLogin()">Negozio</button>
      <button class="cart-btn" onclick="openCart()">🛒 <span id="cart-count">0</span></button>
    </nav>
  </div>
</header>

<main id="page-welcome" class="page on">
  <div class="welcome-shell">
    <div class="welcome-card">
      <h1>Benvenuto</h1>
      <div class="fg"><label>Nome</label><input type="text" id="username" oninput="checkSecretAdmin(this.value)"></div>
      <button id="secret-admin-btn" style="display:none" onclick="showPage('admin-login')">🔐 Admin</button>
      <div class="fg"><label>Telefono</label><input type="tel" id="userphone"></div>
      <button class="btn-primary" onclick="login()">Entra</button>
      <div id="err" style="color:red"></div>
    </div>
  </div>
</main>

<main id="page-shop" class="page">
  <div class="wrap" style="padding-top:20px">
    <div class="pgrid" id="product-grid"></div>
  </div>
</main>

<!-- Modale Prodotto -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this) closeModalDirect()">
  <div class="modal-box">
    <div id="modal-img-wrap"></div>
    <h2 id="modal-title"></h2>
    <p id="modal-desc"></p>
    <button onclick="modalAddToCart()">Aggiungi</button>
    <button onclick="closeModalDirect()">Chiudi</button>
  </div>
</div>

<script>
var products = JSON.parse(localStorage.getItem('fl_v2_products')) || [];
var cart = [], currentUser = {name: '', phone: ''};

function dismissSplash() {
    var sp = document.getElementById('splash');
    if(sp) { sp.style.display = 'none'; document.body.classList.remove('hide-header'); }
}

function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
    document.getElementById('page-' + id).classList.add('on');
    document.body.classList.remove('hide-header');
}

function login() {
    currentUser.name = document.getElementById('username').value;
    currentUser.phone = document.getElementById('userphone').value;
    if(currentUser.name) showPage('shop');
}

function requireLogin() {
    if(!currentUser.name) showPage('welcome');
    else showPage('shop');
}

function checkSecretAdmin(val) {
    document.getElementById('secret-admin-btn').style.display = (val === '0789900') ? 'block' : 'none';
}

function openCart() { alert('Carrello'); }
function closeModalDirect() { document.getElementById('modal-overlay').classList.remove('open'); }
function openModal(id) { document.getElementById('modal-overlay').classList.add('open'); }
function modalAddToCart() { alert('Aggiunto'); closeModalDirect(); }
function loginAdmin() { showPage('admin-dash'); }

// Init
renderShop();
function renderShop(){
    var grid = document.getElementById('product-grid');
    grid.innerHTML = products.map(p => `
        <div class="pcard">
            <div class="pimg">${p.name[0]}</div>
            <div class="pinfo"><h3>${p.name}</h3><button onclick="openModal(${p.id})">Dettagli</button></div>
        </div>
    `).join('');
}
</script>
</body>
</html>
